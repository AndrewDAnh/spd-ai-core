dataset: FD001

data:
  seq_len: 128
  patch_len: 8
  stride: 1
  sensors: [2, 3, 4, 7, 8, 9, 11, 12, 13, 14, 15, 17, 20, 21]
  rul_max: 130
  val_split: 0.2

model:
  d_model: 128
  num_scales: 3
  encoder_depths: [2, 2, 2]
  decoder_depths: [1, 1, 1]
  heads: [4, 4, 8]
  mlp_ratio: 2.0
  dropout: 0.1

training:
  epochs: 120
  batch_size: 64
  grad_clip: 1.0
  amp: true
  seed: 42
  num_workers: 4
  pin_memory: true
  log_interval: 100

optimiser:
  name: adamw
  lr: 0.0002
  weight_decay: 0.01
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_steps: 500
